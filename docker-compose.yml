services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      # the address at which people reach this portal; stamped into sign-in tokens and
      # discovery documents, so it must be the public one when deployed
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - smsgw
    volumes:
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu
      - ./evals:/app/evals:ro



  citizen-mcp:
    build: ./app
    command: ["python", "/mcp_servers/citizen_server.py"]
    ports:
      - "8001:8001"
    environment:
      MCP_PORT: "8001"
      MCP_AUDIENCE: ${CITIZEN_MCP_AUDIENCE:-http://localhost:8001}
      PORTAL_ISSUER: ${PUBLIC_BASE_URL:-http://localhost:8000}
      JWKS_URL: http://app:8000/.well-known/jwks.json
    depends_on:
      - db
      - app
    volumes:
      - ./mcp_servers:/mcp_servers:ro
      - uploads:/var/sewasetu/uploads
      - ./evals:/evals


  officer-mcp:
    build: ./app
    command: ["python", "/mcp_servers/officer_server.py"]
    ports:
      - "8002:8002"
    environment:
      MCP_PORT: "8002"
      MCP_AUDIENCE: ${OFFICER_MCP_AUDIENCE:-http://localhost:8002}
      PORTAL_ISSUER: ${PUBLIC_BASE_URL:-http://localhost:8000}
      JWKS_URL: http://app:8000/.well-known/jwks.json
    depends_on:
      - db
      - app
    volumes:
      - ./mcp_servers:/mcp_servers:ro



  scheduler:
    build: ./app
    # Run the deemed-approval job once at startup (so a freshly restored
    # database is brought up to date), then hand over to cron for the nightly run.
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    # internal only — reached by the app over the docker network and exposed to
    # users via the app at /__gateway/ (so no second host port is needed)
    expose:
      - "8025"

volumes:
  pgdata:
  uploads:
  applogs:
